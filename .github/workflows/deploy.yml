name: Frontend Partner Deploy

on:
  push:
    branches:
      - erp/dev

concurrency:
  group: frontend-partner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Partner-Frontend Application
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            export PATH=$PATH:/home/ubuntu/n/bin

            cd /opt/apps/villagkart/erp-dev/partner_web

            echo "Updating repository..."

            git fetch origin erp/dev
            git reset --hard origin/erp/dev
            git clean -fd

            echo "Installing dependencies..."

            npm i

            echo "Building frontend..."

            npm run build

            echo "Restarting Nginx..."

            sudo systemctl reload nginx

            echo "Frontend deployment completed successfully."